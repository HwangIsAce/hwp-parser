[project]
name = "hwp-converter"
version = "0.1.0"
description = "HWP/HWPX 문서를 JSON/Markdown/HTML 등으로 변환"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "olefile>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hwp_converter*"]
